  <text x="72" y="151" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" letter-spacing="1.15">ROBOTICS · HUMANOIDS · SWARM SYSTEMS · AI</text>
  <text x="72" y="187" fill="#C8D9E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">If it senses, thinks, moves, learns or collaborates, I want to build it.</text>
