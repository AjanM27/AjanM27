<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ajan Muthuraj — Robotics, Humanoids, Swarm Systems, and AI</title>
  <desc id="desc">A clean robotics banner with a humanoid robot, swarm nodes, and engineering grid.</desc>
  <defs>
