<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ajan Muthuraj — Autonomous Drones and Multi-Robot Systems</title>
  <desc id="desc">A clean autonomous-robotics banner with a quadrotor and mapping grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#10243A"/>
      <stop offset="1" stop-color="#0B4A55"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="55" x2="985" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#7EF2CB"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#BDEFF3" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="30" r="180" fill="#22D3EE" fill-opacity=".05"/>
  <circle cx="1130" cy="280" r="220" fill="#34D399" fill-opacity=".06"/>

  <rect x="52" y="66" width="4" height="132" rx="2" fill="url(#accent)"/>
  <circle cx="990" cy="135" r="112" stroke="#67E8F9" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="990" cy="135" r="88" stroke="#7EF2CB" stroke-opacity=".14" stroke-width="2" stroke-dasharray="3 10"/>
  <circle cx="990" cy="135" r="66" stroke="#67E8F9" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(990 135)" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-55 0H55M0-30V30"/>
    <path d="M-28-10L-62-36M28-10L62-36M-28 10L-62 36M28 10L62 36"/>
    <ellipse cx="-73" cy="-44" rx="27" ry="9"/>
    <ellipse cx="73" cy="-44" rx="27" ry="9"/>
    <ellipse cx="-73" cy="44" rx="27" ry="9"/>
    <ellipse cx="73" cy="44" rx="27" ry="9"/>
    <rect x="-30" y="-21" width="60" height="42" rx="12"/>
    <path d="M-12 30L-20 51M12 30L20 51"/>
  </g>

  <text x="70" y="104" fill="#F5FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="-1.5">Ajan Muthuraj</text>
  <text x="72" y="151" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" letter-spacing="1.25">AUTONOMOUS DRONES · MULTI-ROBOT SYSTEMS</text>
  <text x="72" y="187" fill="#C8D9E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Perception, mapping, planning and control for robots in unknown environments.</text>
</svg>
